{% extends "cars/car_base.html" %}

{% block car %}
<div class="jumbotron">
<h3>Car Form Page</h3>
    <form class=jumbotron method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          {{field.errors}}
          <label class=''>{{field.label}}</label> <br>
          {{field}}
        </div>
      {% endfor %}

      <input class='btn btn-primary' type="submit" value="submit">
    </form>

</div>


{% endblock %}
